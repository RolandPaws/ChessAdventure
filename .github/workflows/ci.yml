name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: libsdl3-dev only landed in apt fairly recently and "ubuntu-latest"
      # (24.04) predates it, so it's deliberately not installed here.
      # CMakeLists.txt falls back to fetching and building SDL3/SDL3_image/
      # SDL3_ttf from source (via FetchContent) when find_package(SDL3 ...)
      # can't find a system install -- see the SDL3 fetch block there. That
      # fallback build uses SDL3_image's bundled stb_image backend for
      # PNG/JPG (no libpng/libjpeg needed) but does need system freetype
      # (required) and harfbuzz (optional, for text shaping) for SDL3_ttf.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfreetype-dev libharfbuzz-dev

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure

      - name: Format check
        run: |
          find src tools tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
